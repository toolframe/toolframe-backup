[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "toolframe-backup"
version = "0.1.0"
description = "Stopped-application recovery archives and a local Backup catalog for Toolframe"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.14"
dependencies = ["toolframe-sdk==0.3.0", "packaging>=25"]

[project.optional-dependencies]
operator = ["toolframe-core>=0.6,<0.7"]
ui = ["streamlit==1.61.0"]

[project.scripts]
toolframe-backup = "toolframe_backup.cli:main"

[project.entry-points."toolframe.plugins"]
backup = "toolframe_backup.plugin:plugin"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1", "hatchling>=1.27,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/toolframe_backup"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py314"
